<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>制度通知システム v3.35</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style id="theme-style"></style>
    <style>
        .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid #94a3b8; background: transparent; color: inherit; cursor: pointer; transition: background 0.15s; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app"></div>

    <script>
        // ---- 設定 ----
        const API_URL = 'https://seido-notify-api-646437906593.asia-northeast1.run.app';

        // ---- テーマ ----
        let theme = localStorage.getItem('theme') || 'dark';

        const DARK_CSS = `
            body { background: #0f172a; color: #f1f5f9; }
            .text-gray-800,.text-gray-700,.text-gray-600,.text-gray-500,.text-gray-400 { color: #e2e8f0 !important; }
            .bg-white { background: #1e293b !important; }
            .bg-gray-50 { background: #0f172a !important; }
            .bg-gray-100 { background: #273548 !important; }
            .bg-gray-200 { background: #334155 !important; }
            .shadow-md { box-shadow: 0 4px 6px rgba(0,0,0,0.5) !important; }
            .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.6) !important; }
            .border-gray-300 { border-color: #475569 !important; }
            input { background: #1e293b !important; color: #f1f5f9 !important; border-color: #475569 !important; }
            .bg-green-50 { background: #064e3b !important; }
            .text-green-800 { color: #6ee7b7 !important; }
            a.flex-1 { background: transparent !important; border: 1.5px solid #94a3b8 !important; color: #e2e8f0 !important; }
            a.flex-1:hover { background: #334155 !important; }
            .filter-active { background: #ffffff !important; color: #1d4ed8 !important; font-weight: 600; }
            .filter-inactive { background: #334155 !important; color: #94a3b8 !important; }
            .filter-inactive:hover { background: #475569 !important; color: #e2e8f0 !important; }
            .icon-btn { border-color: #94a3b8; color: #e2e8f0; }
            .icon-btn:hover { background: #334155; }
        `;

        const LIGHT_CSS = `
            body { background: linear-gradient(to bottom, #eff6ff, #ffffff); }
        `;

        function applyTheme() {
            document.getElementById('theme-style').textContent = theme === 'dark' ? DARK_CSS : LIGHT_CSS;
        }

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            applyTheme();
            render();
        }

        applyTheme();

        // ---- 状態 ----
        let notices = JSON.parse(localStorage.getItem('notices') || '[]');
        let savedCity = localStorage.getItem('parentCity') || '';
        const CATEGORIES = ['子育て・教育','健康・福祉','くらし・手続き','ビジネス','防災・安全','その他'];
        const DEFAULT_INTERESTS = CATEGORIES;
        let readIds = new Set(JSON.parse(localStorage.getItem('readIds') || '[]'));
        let newIds = new Set(JSON.parse(localStorage.getItem('newIds') || '[]'));
        let lastFetchedAt = localStorage.getItem('lastFetchedAt') || null;
        // statusFilter: 'all' | 'unread' | 'read'
        let statusFilter = localStorage.getItem('statusFilter') || 'all';
        // categoryFilters: [] = すべて, [...] = 選択カテゴリ（OR条件）
        let categoryFilters = JSON.parse(localStorage.getItem('categoryFilters') || '[]');
        const _savedRaw = localStorage.getItem('interests');
        let savedInterests = _savedRaw ? JSON.parse(_savedRaw) : DEFAULT_INTERESTS;
        function getPageFromHash() {
            const hash = location.hash;
            if (hash === '#list') return 'list';
            return 'home';
        }
        let currentPage = getPageFromHash();

        window.addEventListener('popstate', () => {
            const newPage = getPageFromHash();
            if (newPage === 'list' && currentPage === 'list') {
                updateCheckButtons();
            } else {
                currentPage = newPage;
                render();
            }
        });

        // BFCache対応：フリックバック時にlocalStorageから再読み込みして完全再描画
        // スクロール連動ヘッダ（下スクロールで隠れ、上スクロールで出る）
        let lastScrollY = 0;
        let headerEl = null;
        window.addEventListener('scroll', () => {
            if (!headerEl) headerEl = document.querySelector('.sticky-header');
            if (!headerEl) return;
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 60) {
                headerEl.style.transform = 'translateY(-100%)';
            } else {
                headerEl.style.transform = 'translateY(0)';
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        // フリックバック時の状態更新（BFCache対応）
        window.addEventListener('pageshow', () => {
            readIds = new Set(JSON.parse(localStorage.getItem('readIds') || '[]'));
            newIds = new Set(JSON.parse(localStorage.getItem('newIds') || '[]'));
            render();
        });
        let isLoading = false;
        let statusMessage = '';

        // ---- API取得 ----
        async function fetchNotices() {
            isLoading = true;
            statusMessage = '最新情報を取得中...';
            // 取得時に前回のNewをクリア（今回の新着だけをNewにする）
            newIds = new Set();
            localStorage.setItem('newIds', JSON.stringify([]));
            render();

            try {
                const since = localStorage.getItem('lastFetchedAt');
                const cityParam = savedCity ? `&city=${encodeURIComponent(savedCity)}` : '';
                const url = since
                    ? `${API_URL}?since=${encodeURIComponent(since)}${cityParam}`
                    : `${API_URL}?${cityParam ? cityParam.slice(1) : ''}`;

                const response = await fetch(url);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                // 差分を追記
                if (data.notices && data.notices.length > 0) {
                    const existingIds = new Set(notices.map(n => n.id));
                    const newNotices = data.notices.filter(n => !existingIds.has(n.id));
                    notices = [...newNotices, ...notices];
                    localStorage.setItem('notices', JSON.stringify(notices));
                    // 新着IDをnewIdsに追加
                    newNotices.forEach(n => newIds.add(n.id));
                    // 初回取得（newIdsが空）は全件をnewIdsに追加
                    if (newIds.size === newNotices.length && existingIds.size === 0) {
                        notices.forEach(n => newIds.add(n.id));
                    }
                    localStorage.setItem('newIds', JSON.stringify([...newIds]));
                    statusMessage = `${newNotices.length}件の新着情報を取得しました`;
                } else {
                    statusMessage = '新着情報はありません';
                }

                // サーバー時刻を保存（次回のsinceに使用）
                if (data.serverTime) {
                    localStorage.setItem('lastFetchedAt', data.serverTime);
                }

            } catch (err) {
                console.error('取得エラー:', err);
                statusMessage = `取得に失敗しました: ${err.message}`;
            } finally {
                isLoading = false;
                render();
            }
        }

        // ---- フィルタリング ----
        function isNew(n) {
            return newIds.has(n.id);
        }

        function getFilteredNotices() {
            const filtered = notices.filter(n => {
                // 地域フィルタ
                if (savedCity && !n.city.includes(savedCity) && !savedCity.includes(n.city.replace('（東京）','').replace('（大阪）',''))) return false;
                // カテゴリフィルタ
                const cat = CATEGORIES.includes(n.normalizedCategory) ? n.normalizedCategory : 'その他';
                if (categoryFilters.length > 0 && !categoryFilters.includes(cat)) return false;
                // ステータスフィルタ
                const isRead = readIds.has(n.id);
                if (statusFilter === 'unread' && isRead) return false;
                if (statusFilter === 'read' && !isRead) return false;
                return true;
            });
            return filtered.sort((a, b) => {
                const da = a.pubdate ? new Date(a.pubdate) : new Date(0);
                const db = b.pubdate ? new Date(b.pubdate) : new Date(0);
                return db - da;
            });
        }

        function getUnreadCount() {
            return notices.filter(n => {
                if (savedCity && !n.city.includes(savedCity) && !savedCity.includes(n.city.replace('（東京）','').replace('（大阪）',''))) return false;
                return !readIds.has(n.id);
            }).length;
        }

        // ---- ページレンダリング ----
        function render() {
            const app = document.getElementById('app');
            switch(currentPage) {
                case 'home':   app.innerHTML = renderHomePage(); break;
                case 'list':   app.innerHTML = renderListPage(); break;
                case 'detail': app.innerHTML = renderDetailPage(); break;
            }
        }

        // ---- ホームページ ----
        function renderHomePage() {
            const filtered = notices.filter(n => savedCity && (n.city.includes(savedCity) || savedCity.includes(n.city.replace('（東京）','').replace('（大阪）',''))));

            return `
                <div class="container mx-auto px-4 py-8 md:py-16">
                    <div class="max-w-2xl mx-auto">
                        <div style="position:fixed;top:16px;right:16px;z-index:100;">
                            <button onclick="toggleTheme()" title="テーマ切り替え" style="background:rgba(37,99,235,0.9);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:18px;color:white;box-shadow:0 2px 8px rgba(0,0,0,0.3);">
                                ${theme === 'dark' ? '☀️' : '🌙'}
                            </button>
                        </div>
                        <div class="text-center mb-12">
                            <h1 class="text-3xl md:text-5xl font-bold text-gray-800 mb-4">
                                地域の支援制度を<br>
                                見逃さない。
                            </h1>
                            <p class="text-gray-600 text-lg">
                                地域の支援制度をお知らせします
                            </p>
                        </div>

                        <div class="bg-white rounded-lg shadow-lg p-6 md:p-8 mb-6">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">地域を登録</h2>
                            ${savedCity ? `
                                <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                                    <p class="text-green-800"><span class="font-bold">登録済み:</span> ${savedCity}</p>
                                </div>
                            ` : ''}
                            <form onsubmit="saveCity(event)" class="space-y-4">
                                <div>
                                    <label class="block text-gray-700 font-medium mb-2">市区町村名</label>
                                    <input
                                        type="text"
                                        id="cityInput"
                                        value="${savedCity}"
                                        placeholder="例: 横浜市"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        required
                                    />
                                </div>
                                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700">
                                    登録する
                                </button>
                            </form>
                        </div>

                        ${savedCity ? `
                            <div class="space-y-4">
                                <button onclick="goToList()"
                                    class="w-full bg-green-600 text-white font-bold py-4 px-6 rounded-lg hover:bg-green-700 text-lg shadow-lg">
                                    制度一覧を見る（${filtered.length}件）→
                                </button>
                                <button onclick="fetchNotices()"
                                    ${isLoading ? 'disabled' : ''}
                                    class="w-full bg-blue-600 text-white font-bold py-4 px-6 rounded-lg hover:bg-blue-700 text-lg shadow-lg ${isLoading ? 'opacity-50 cursor-not-allowed' : ''}">
                                    ${isLoading ? '🔄 取得中...' : '🔄 最新情報を取得'}
                                </button>
                                ${statusMessage ? `
                                    <div style="padding:16px;border-radius:8px;background:${statusMessage.includes('失敗') ? (theme==='dark'?'#450a0a':'#fef2f2') : (theme==='dark'?'#1e3a5f':'#eff6ff')};border:1px solid ${statusMessage.includes('失敗') ? (theme==='dark'?'#7f1d1d':'#fecaca') : (theme==='dark'?'#3b5998':'#bfdbfe')};">
                                        <p style="font-size:14px;color:${theme==='dark'?'#e2e8f0':'#1e40af'};">${statusMessage}</p>
                                    </div>
                                ` : ''}
                                <button onclick="resetLocalStorage()"
                                    class="w-full bg-gray-200 text-gray-600 text-sm py-2 px-4 rounded-lg hover:bg-gray-300">
                                    🗑 ローカルデータをリセット
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ---- 一覧ページ ----
        function renderListPage() {
            const filtered = getFilteredNotices();
            const unreadCount = getUnreadCount();
            const statusBtns = ['all','unread','read'].map(s => {
                const labels = {all: 'すべて', unread: `未読 <span style="background:#ef4444;color:white;border-radius:999px;padding:1px 8px;font-size:11px;margin-left:4px;">${unreadCount}</span>`, read: '既読'};
                const active = statusFilter === s;
                const activeStyle = theme === 'dark' ? 'background:#ffffff;color:#1d4ed8;font-weight:600;' : 'background:#ffffff;color:#1d4ed8;font-weight:600;border:1.5px solid #1d4ed8;';
                const inactiveStyle = theme === 'dark' ? 'background:#334155;color:#e2e8f0;' : 'background:rgba(255,255,255,0.3);color:#ffffff;';
                return `<button onclick="setStatusFilter('${s}')" style="padding:4px 12px;border-radius:999px;font-size:12px;white-space:nowrap;border:none;cursor:pointer;${active ? activeStyle : inactiveStyle}">${labels[s]}</button>`;
            }).join('');

            const catBtns = [null, ...CATEGORIES].map(c => {
                const active = c === null ? categoryFilters.length === 0 : categoryFilters.includes(c);
                const label = c || '全カテゴリ';
                const activeStyle = theme === 'dark' ? 'background:#ffffff;color:#1d4ed8;font-weight:600;' : 'background:#ffffff;color:#1d4ed8;font-weight:600;border:1.5px solid #1d4ed8;';
                const inactiveStyle = theme === 'dark' ? 'background:#334155;color:#e2e8f0;' : 'background:rgba(255,255,255,0.3);color:#ffffff;';
                return `<button onclick="toggleCategoryFilter(${c ? `'${c}'` : 'null'})" style="padding:4px 12px;border-radius:999px;font-size:12px;white-space:nowrap;border:none;cursor:pointer;${active ? activeStyle : inactiveStyle}">${label}</button>`;
            }).join('');

            return `
                <div class="min-h-screen bg-gray-50">
                    <div style="background:${theme === 'dark' ? '#1e3a5f' : '#2563eb'};transition:transform 0.3s ease;" class="sticky-header text-white shadow-lg sticky top-0 z-10">
                        <div class="container mx-auto px-4 pt-4 pb-3">
                            <div class="flex items-center justify-between mb-3">
                                <button onclick="goToHome()" class="text-sm hover:underline">← トップに戻る</button>
                                <div class="flex items-center gap-3">
                                    <span class="text-sm text-blue-100">${savedCity}の支援制度 ${filtered.length}件</span>
                                    <button onclick="toggleTheme()" title="テーマ切り替え" style="background:rgba(255,255,255,0.15);border:none;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:16px;color:white;">${theme === 'dark' ? '☀️' : '🌙'}</button>
                                </div>
                            </div>
                            <div class="flex gap-2 mb-2 overflow-x-auto pb-1">
                                ${statusBtns}
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${catBtns}
                            </div>
                        </div>
                    </div>
                    <div class="container mx-auto px-4 py-6">
                        <div class="max-w-4xl mx-auto space-y-4">
                            ${filtered.length === 0 ? `
                                <div class="text-center text-gray-500 py-16">
                                    <p class="text-xl">該当する制度情報がありません</p>
                                </div>
                            ` : filtered.map(n => {
                                const isRead = readIds.has(n.id);
                                const newBadge = isNew(n) ? `<span class="bg-red-500 text-white text-xs rounded-full px-2 py-0.5 font-medium">New</span>` : '';
                                const checkBtn = `<button data-notice-id="${n.id}" onclick="toggleRead('${n.id}')" aria-label="${isRead ? '未読に戻す' : '既読にする'}" style="width:28px;height:28px;border-radius:50%;border:2px solid ${isRead ? '#3b5998' : '#6b7280'};background:${isRead ? '#3b5998' : 'transparent'};color:${isRead ? '#fff' : '#6b7280'};display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:14px;line-height:1;">✓</button>`;
                                return `
                                <div class="bg-white rounded-lg shadow-md p-5">
                                    <div class="flex items-start justify-between gap-2 mb-2">
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">${n.normalizedCategory || 'その他'}</span>
                                            ${newBadge}
                                            <span class="text-gray-400 text-xs">更新日: ${new Date(n.pubdate || n.fetchedAt).toLocaleDateString('ja-JP')}</span>
                                        </div>
                                        ${checkBtn}
                                    </div>
                                    <h2 style="font-size:16px;font-weight:700;color:${theme==='dark'?'#f1f5f9':'#1e293b'};margin-bottom:8px;">${n.title}</h2>
                                    <p style="font-size:13px;color:${theme==='dark'?'#aab4be':'#475569'};margin-bottom:12px;">${n.summary || ''}</p>
                                    ${n.targetAudience ? `<p style="font-size:12px;color:${theme==='dark'?'#aab4be':'#64748b'};margin-bottom:4px;">対象: ${n.targetAudience}</p>` : ''}
                                    ${n.applicationInfo && n.applicationInfo !== '不明' ? `<p style="font-size:12px;color:${theme==='dark'?'#aab4be':'#64748b'};margin-bottom:12px;">申請: ${n.applicationInfo}</p>` : ''}
                                    <div class="flex items-center gap-2 mt-3">
                                        <button onclick="openDetail('${n.id}', '${n.url}')"
                                            style="flex:1;text-align:center;padding:8px 16px;border-radius:8px;border:1.5px solid ${theme==='dark'?'#94a3b8':'#cbd5e1'};color:${theme==='dark'?'#e2e8f0':'#374151'};background:${theme==='dark'?'transparent':'#f9fafb'};font-size:13px;font-weight:500;cursor:pointer;">
                                            詳細を見る
                                        </button>
                                        <button onclick="copyNotice('${n.id}')" title="コピー"
                                            class="icon-btn">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                        </button>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // ---- 詳細ページ（削除・一覧から直接自治体サイトへ） ----
        // 詳細は自治体サイトへの直接リンクで対応

        // ---- 親向けページ ----

        // ---- イベントハンドラ ----
        function saveCity(event) {
            event.preventDefault();
            const city = document.getElementById('cityInput').value.trim();
            if (city) {
                localStorage.setItem('parentCity', city);
                savedCity = city;
                render();
            }
        }

        function setStatusFilter(s) {
            statusFilter = s;
            localStorage.setItem('statusFilter', s);
            render();
        }

        function toggleCategoryFilter(c) {
            if (c === null) {
                categoryFilters = [];
            } else {
                const idx = categoryFilters.indexOf(c);
                if (idx >= 0) categoryFilters.splice(idx, 1);
                else categoryFilters.push(c);
            }
            localStorage.setItem('categoryFilters', JSON.stringify(categoryFilters));
            render();
        }

        function markRead(id) {
            readIds.add(id);
            localStorage.setItem('readIds', JSON.stringify([...readIds]));
            newIds.delete(id);
            localStorage.setItem('newIds', JSON.stringify([...newIds]));
        }

        function openDetail(id, url) {
            markRead(id);
            window.location.href = url;
        }

        function toggleRead(id) {
            if (readIds.has(id)) {
                readIds.delete(id);
            } else {
                readIds.add(id);
                newIds.delete(id);
                localStorage.setItem('newIds', JSON.stringify([...newIds]));
            }
            localStorage.setItem('readIds', JSON.stringify([...readIds]));
            render();
        }

        function resetLocalStorage() {
            if (!confirm('ローカルデータを全て削除します。よろしいですか？')) return;
            localStorage.removeItem('notices');
            localStorage.removeItem('parentCity');
            localStorage.removeItem('interests');
            localStorage.removeItem('lastFetchedAt');
            localStorage.removeItem('readIds');
            localStorage.removeItem('newIds');
            notices = [];
            savedCity = '';
            savedInterests = [...DEFAULT_INTERESTS];
            readIds = new Set();
            newIds = new Set();
            statusFilter = 'all';
            categoryFilters = [];
            localStorage.removeItem('statusFilter');
            localStorage.removeItem('categoryFilters');
            statusMessage = 'ローカルデータをリセットしました';
            render();
        }


        // トースト表示
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // コピー機能
        function copyNotice(id) {
            const n = notices.find(n => n.id === id);
            if (!n) return;
            const appInfo = n.applicationInfo && n.applicationInfo !== '不明' ? n.applicationInfo : '';
            const text = [
                n.title,
                n.summary ? `【内容】${n.summary}` : '',
                n.targetAudience ? `【対象】${n.targetAudience}` : '',
                appInfo ? `【申請方法】${appInfo}` : '',
                `【詳細】${n.url}`,
            ].filter(Boolean).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                showToast('コピーしました');
            }).catch(() => {
                showToast('コピーできませんでした');
            });
        }

        function updateCheckButtons() {
            // ✓ボタンの状態だけ更新（re-renderしない）
            document.querySelectorAll('[data-notice-id]').forEach(btn => {
                const id = btn.dataset.noticeId;
                const isRead = readIds.has(id);
                if (isRead) {
                    btn.classList.add('bg-blue-600', 'border-blue-600', 'text-white');
                    btn.classList.remove('border-gray-300', 'text-gray-300');
                    btn.setAttribute('aria-label', '未読に戻す');
                } else {
                    btn.classList.remove('bg-blue-600', 'border-blue-600', 'text-white');
                    btn.classList.add('border-gray-300', 'text-gray-300');
                    btn.setAttribute('aria-label', '既読にする');
                }
            });
        }

        function goToHome() { currentPage = 'home'; statusMessage = ''; history.pushState(null, '', '#home'); render(); window.scrollTo(0,0); }
        function goToList() {
            if (!savedCity) { alert('先に地域を登録してください'); return; }
            currentPage = 'list'; history.pushState(null, '', '#list'); render(); window.scrollTo(0,0);
        }

        // 初期レンダリング
        render();
    </script>
</body>
